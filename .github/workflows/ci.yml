name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      # The sample data is broken on purpose, so the gate must fail (exit code 1).
      - name: Run checks on the sample data
        run: |
          set +e
          python -m bwdq run --out report
          code=$?
          test "$code" -eq 1
      - uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: report/
